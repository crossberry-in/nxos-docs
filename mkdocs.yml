# Noxs documentation — Material for MkDocs
#
# Docs site for Noxs (https://github.com/crossberry-in/noxs) — deployed to
# GitHub Pages by .github/workflows/deploy-pages.yml on every push to main.

site_name: Noxs Docs
site_description: >-
  Noxs — a real Ubuntu 24.04 Linux environment for Android. A genuine
  Ubuntu userspace with APT, sudo, Unix sockets and a real terminal,
  inside the Android app sandbox. A small Linux computer in your pocket.
site_url: https://crossberry-in.github.io/nxos-docs/
repo_url: https://github.com/crossberry-in/nxos-docs
repo_name: crossberry-in/nxos-docs
edit_uri: edit/main/docs/
site_author: CrossberryWeb

theme:
  name: material
  favicon: assets/images/favicon.svg
  icon:
    logo: material/console
    repo: fontawesome/brands/github
  palette:
    # Light / dark schemes with automatic + manual toggle
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  # System font stack (Apple-inspired) is applied in assets/style.css;
  # Material's Google-Fonts download is disabled by omitting font.text.
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.tabs.link
    - toc.follow
    - header.autohide

extra:
  generator: false
  social:
    - icon: material/github
      link: https://github.com/crossberry-in
      name: crossberry-in on GitHub

extra_css:
  - assets/style.css

copyright: >
  Copyright &copy; CrossberryWeb — Apache-2.0

markdown_extensions:
  - attr_list
  - md_in_html
  - def_list
  - tables
  - footnotes
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.mark
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

